name: AliExpress Daily Farm

on:
  schedule:
    # 1. Ранній ранок (найнижче навантаження на сервери GitHub) ~06:23 (05:23 взимку, 03:23 UTC)
    - cron: '23 3 * * *'
    # 2. Ранок ~10:41 (09:41 взимку, 07:41 UTC)
    - cron: '41 7 * * *'
    # 3. Обід ~13:17 (12:17 взимку, 10:17 UTC)
    - cron: '17 10 * * *'
    # 4. Вечір ~17:33 (16:33 взимку, 14:33 UTC)
    - cron: '33 14 * * *'
    # 5. Контрольний нічний запуск ~21:19 (20:19 взимку, 18:19 UTC)
    - cron: '19 18 * * *'
  workflow_dispatch:
    # Можливість запустити вручну з вкладки Actions у GitHub

concurrency:
  group: aliexpress-daily-farm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AliExpress Farmer
        env:
          # Пропускаємо довгу паузу при ручному запуску через кнопку
          SKIP_RANDOM_SLEEP: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Гнучка передача необмеженої кількості акаунтів через єдиний JSON-секрет
          ALI_COOKIES_JSON: ${{ secrets.ALI_COOKIES_JSON }}
          # Основний або перший акаунт
          ALI_COOKIES: ${{ secrets.ALI_COOKIES }}
          # Додаткові акаунти (до 10 акаунтів із окремими секретами)
          ALI_COOKIES_1: ${{ secrets.ALI_COOKIES_1 }}
          ALI_COOKIES_2: ${{ secrets.ALI_COOKIES_2 }}
          ALI_COOKIES_3: ${{ secrets.ALI_COOKIES_3 }}
          ALI_COOKIES_4: ${{ secrets.ALI_COOKIES_4 }}
          ALI_COOKIES_5: ${{ secrets.ALI_COOKIES_5 }}
          ALI_COOKIES_6: ${{ secrets.ALI_COOKIES_6 }}
          ALI_COOKIES_7: ${{ secrets.ALI_COOKIES_7 }}
          ALI_COOKIES_8: ${{ secrets.ALI_COOKIES_8 }}
          ALI_COOKIES_9: ${{ secrets.ALI_COOKIES_9 }}
          ALI_COOKIES_10: ${{ secrets.ALI_COOKIES_10 }}
          # Підтримка проксі (опційно для окремих акаунтів)
          ALI_PROXY: ${{ secrets.ALI_PROXY }}
          ALI_PROXY_1: ${{ secrets.ALI_PROXY_1 }}
          ALI_PROXY_2: ${{ secrets.ALI_PROXY_2 }}
          ALI_PROXY_3: ${{ secrets.ALI_PROXY_3 }}
          ALI_PROXY_4: ${{ secrets.ALI_PROXY_4 }}
          ALI_PROXY_5: ${{ secrets.ALI_PROXY_5 }}
          ALI_PROXY_6: ${{ secrets.ALI_PROXY_6 }}
          ALI_PROXY_7: ${{ secrets.ALI_PROXY_7 }}
          ALI_PROXY_8: ${{ secrets.ALI_PROXY_8 }}
          ALI_PROXY_9: ${{ secrets.ALI_PROXY_9 }}
          ALI_PROXY_10: ${{ secrets.ALI_PROXY_10 }}
          # Сповіщення в Telegram (опційно)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main
